# docker-compose.yml
services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: docker-practice-auth-frontend
    container_name: auth_frontend
    restart: unless-stopped
    environment:
      API_PROXY_TARGET: http://api:3000
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    command: sh -c "npm ci && npm run dev:web"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - app-net

  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: docker-practice-auth-api
    container_name: auth_api
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://postgres:secretpassword@db:5432/auth_db
      JWT_SECRET: secret_jwt_key
      JUDGE0_BASE_URL: http://judge0-server:2358
      JUDGE0_CPU_TIME_LIMIT: 10
      JUDGE0_WALL_TIME_LIMIT: 15
      JUDGE0_MEMORY_LIMIT_KB: 262144
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    command: sh -c "npm ci && npm run dev"
    depends_on:
      db:
        condition: service_healthy
      judge0-server:
        condition: service_started
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  db:
    image: postgres:15-alpine
    container_name: auth_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: auth_db
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - app-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  judge0-server:
    image: judge0/judge0:1.13.1
    container_name: judge0_server
    restart: unless-stopped
    privileged: true
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    ports:
      - "127.0.0.1:2358:2358"
    depends_on:
      judge0-db:
        condition: service_healthy
      judge0-redis:
        condition: service_healthy
    networks:
      - app-net

  judge0-workers:
    image: judge0/judge0:1.13.1
    container_name: judge0_workers
    restart: unless-stopped
    privileged: true
    command: ["./scripts/workers"]
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    depends_on:
      judge0-db:
        condition: service_healthy
      judge0-redis:
        condition: service_healthy
    networks:
      - app-net

  judge0-db:
    image: postgres:16.2
    container_name: judge0_db
    restart: unless-stopped
    env_file:
      - judge0.conf
    volumes:
      - judge0_data:/var/lib/postgresql/data
    networks:
      - app-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U judge0 -d judge0"]
      interval: 5s
      timeout: 5s
      retries: 10

  judge0-redis:
    image: redis:7.2.4
    container_name: judge0_redis
    restart: unless-stopped
    command: [
      "bash", "-c",
      'docker-entrypoint.sh --appendonly no --requirepass "$$REDIS_PASSWORD"'
    ]
    env_file:
      - judge0.conf
    volumes:
      - judge0_redis_data:/data
    networks:
      - app-net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  pg_data:
  judge0_data:
  judge0_redis_data:

networks:
  app-net:
    driver: bridge
