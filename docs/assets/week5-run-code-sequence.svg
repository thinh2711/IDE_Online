<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="804" viewBox="0 0 1280 804">
  <defs>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="0" cy="0" r="2.5" fill="#e8e8ec"/>
      <circle cx="20" cy="20" r="2.5" fill="#e8e8ec"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2f2f35"/>
    </marker>
    <marker id="arrow-dashed" markerWidth="10" markerHeight="10" refX="1" refY="5" orient="auto">
      <path d="M10,0 L0,5 L10,10 Z" fill="#2f2f35"/>
    </marker>
    <style>
      .box { fill: #eeebff; stroke: #8b5cf6; stroke-width: 1.4; }
      .life { stroke: #8b5cf6; stroke-width: 2.2; }
      .line { stroke: #2f2f35; stroke-width: 2; marker-end: url(#arrow); }
      .return { stroke: #2f2f35; stroke-width: 2; stroke-dasharray: 4 4; marker-start: url(#arrow-dashed); }
      .label { fill: #2f2f35; font-family: Inter, Arial, sans-serif; font-size: 20px; }
      .title { fill: #111118; font-family: Inter, Arial, sans-serif; font-size: 20px; }
      .small { fill: #2f2f35; font-family: Inter, Arial, sans-serif; font-size: 18px; }
    </style>
  </defs>
  <rect width="1280" height="804" fill="#fbfbfc"/>
  <rect width="1280" height="804" fill="url(#dots)"/>

  <rect class="box" x="61" y="12" width="178" height="78" rx="4"/>
  <text class="title" x="150" y="57" text-anchor="middle">Coder Browser</text>
  <line class="life" x1="150" y1="90" x2="150" y2="697"/>
  <rect class="box" x="61" y="697" width="178" height="78" rx="4"/>
  <text class="title" x="150" y="743" text-anchor="middle">Coder Browser</text>

  <rect class="box" x="420" y="12" width="178" height="78" rx="4"/>
  <text class="title" x="509" y="57" text-anchor="middle">Express API</text>
  <line class="life" x1="509" y1="90" x2="509" y2="697"/>
  <rect class="box" x="420" y="697" width="178" height="78" rx="4"/>
  <text class="title" x="509" y="743" text-anchor="middle">Express API</text>

  <rect class="box" x="824" y="12" width="178" height="78" rx="4"/>
  <text class="title" x="913" y="57" text-anchor="middle">PostgreSQL</text>
  <line class="life" x1="913" y1="90" x2="913" y2="697"/>
  <rect class="box" x="824" y="697" width="178" height="78" rx="4"/>
  <text class="title" x="913" y="743" text-anchor="middle">PostgreSQL</text>

  <rect class="box" x="1061" y="12" width="178" height="78" rx="4"/>
  <text class="title" x="1150" y="57" text-anchor="middle">Judge0</text>
  <line class="life" x1="1150" y1="90" x2="1150" y2="697"/>
  <rect class="box" x="1061" y="697" width="178" height="78" rx="4"/>
  <text class="title" x="1150" y="743" text-anchor="middle">Judge0</text>

  <text class="label" x="212" y="131">POST /api/submissions/run</text>
  <line class="line" x1="150" y1="146" x2="506" y2="146"/>

  <text class="small" x="509" y="189" text-anchor="middle">Verify JWT + RBAC</text>
  <path d="M510 202 C581 202 581 228 510 228" fill="none" stroke="#2f2f35" stroke-width="2" marker-end="url(#arrow)"/>

  <text class="small" x="509" y="282" text-anchor="middle">Validate body and payload size</text>
  <path d="M510 294 C581 294 581 320 510 320" fill="none" stroke="#2f2f35" stroke-width="2" marker-end="url(#arrow)"/>

  <text class="small" x="711" y="374" text-anchor="middle">Check question if provided</text>
  <line class="line" x1="509" y1="388" x2="910" y2="388"/>

  <text class="small" x="711" y="431" text-anchor="middle">Insert submission status=queued</text>
  <line class="line" x1="509" y1="445" x2="910" y2="445"/>

  <text class="small" x="830" y="487" text-anchor="middle">Submit sourceCode + stdin + limits</text>
  <line class="line" x1="509" y1="503" x2="1147" y2="503"/>

  <text class="small" x="830" y="545" text-anchor="middle">stdout/stderr/status/time/memory</text>
  <line class="return" x1="509" y1="560" x2="1150" y2="560"/>

  <text class="small" x="711" y="602" text-anchor="middle">Update submission result</text>
  <line class="line" x1="509" y1="616" x2="910" y2="616"/>

  <text class="small" x="304" y="660" text-anchor="middle">Sanitized submission result</text>
  <line class="return" x1="150" y1="674" x2="509" y2="674"/>
</svg>
